<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iRIC 計算結果ビューア</title>
<style>
  :root { --bg:#f3f5f8; --panel:#fff; --side:#f8f9fb; --line:#d9dce1; --fg:#1f2328; --muted:#6a707a; --accent:#1f6feb; --danger:#b42318; --ok:#1a7f37; --sidebar-w:320px; --drawer-h:260px; --drawer-w:460px; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13.5px/1.45 system-ui, "Segoe UI", "Yu Gothic UI", sans-serif; display:flex; flex-direction:column; overflow:hidden; }
  button { font:inherit; padding:4px 10px; border:1px solid var(--line); border-radius:4px; background:#fff; cursor:pointer; color:var(--fg); }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.icon { padding:2px 8px; font-size:16px; line-height:1.2; }
  button.small { padding:1px 6px; font-size:12px; }
  select, input[type=number], input[type=text], input[type=search] { font:inherit; padding:3px 6px; border:1px solid var(--line); border-radius:4px; background:#fff; color:var(--fg); min-width:0; }
  .sub { color:var(--muted); font-size:12px; }
  .err { color:var(--danger); white-space:pre-wrap; font-size:12px; }
  .err:empty { display:none; }
  /* ---- header ---- */
  header.top { height:42px; flex:none; display:flex; align-items:center; gap:12px; padding:0 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  header.top h1 { font-size:15px; margin:0; white-space:nowrap; }
  #projName { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:40vw; }
  .chip { display:inline-block; border:1px solid var(--line); border-radius:12px; padding:0 9px; font-size:12px; background:#fff; white-space:nowrap; }
  .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  header.top .spacer { flex:1; }
  /* ---- shell ---- */
  #app { flex:1; display:flex; min-height:0; }
  #sidebar { width:var(--sidebar-w); flex:none; overflow-y:auto; overflow-x:hidden; background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  #sidebar.collapsed { display:none; }
  #sidebar details.grp { border-bottom:1px solid var(--line); }
  #sidebar details.grp[hidden] { display:none; }
  #sidebar details.grp > summary { cursor:pointer; padding:8px 12px; font-weight:600; font-size:13px; list-style:none; display:flex; align-items:center; gap:6px; user-select:none; }
  #sidebar details.grp > summary::-webkit-details-marker { display:none; }
  #sidebar details.grp > summary::before { content:"▸"; color:var(--muted); font-size:11px; width:10px; }
  #sidebar details.grp[open] > summary::before { content:"▾"; }
  #sidebar details.grp > summary .hint { margin-left:auto; font-weight:400; color:var(--muted); font-size:11px; }
  #sidebar .body { padding:4px 12px 12px; display:flex; flex-direction:column; gap:8px; }
  #sidebar label.f { display:flex; flex-direction:column; gap:2px; font-size:12px; color:var(--muted); }
  #sidebar label.f select, #sidebar label.f input[type=text] { width:100%; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row input[type=number] { width:74px; }
  .row.tight { gap:4px; }
  .stats { font-size:11.5px; color:var(--muted); font-family:ui-monospace, Consolas, monospace; white-space:pre-wrap; word-break:break-all; }
  /* data group */
  #roots { display:flex; flex-direction:column; gap:2px; }
  #roots .root { display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--muted); }
  #roots .root span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left; }
  #folderbar { display:flex; gap:4px; flex-wrap:wrap; }
  #folderbar[hidden] { display:none; }
  #folderbar input { flex:1; min-width:120px; }
  #findbar { display:flex; gap:4px; align-items:center; }
  #findbar input[type=search] { flex:1; min-width:80px; }
  #findbar select { font-size:12px; }
  #plist { border-collapse:collapse; width:100%; font-size:12px; }
  #plist td { padding:3px 4px; border-bottom:1px solid var(--line); vertical-align:middle; }
  #plist tr.sel { background:#eaf1ff; }
  #plist td.name { max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #plist td.st { white-space:nowrap; color:var(--muted); font-size:11.5px; }
  #plist td.st .ok { color:var(--ok); }
  #plist td.st .run { color:var(--accent); }
  #plist td.st .bad { color:var(--danger); }
  #plist .bar { display:inline-block; width:52px; height:6px; border:1px solid var(--line); border-radius:3px; vertical-align:middle; overflow:hidden; background:#fff; }
  #plist .bar i { display:block; height:100%; background:var(--accent); }
  #storage { font-size:11.5px; color:var(--muted); }
  #storage .bar { display:block; height:6px; border:1px solid var(--line); border-radius:3px; overflow:hidden; background:#fff; margin-top:2px; }
  #storage .bar i { display:block; height:100%; background:var(--accent); }
  #storage .bar i.warn { background:var(--danger); }
  /* ---- stage ---- */
  #stage { flex:1; min-width:0; display:flex; flex-direction:column; padding:8px; gap:6px; position:relative; }
  #stage.side { flex-direction:row; }
  #stage.side .drawer { width:var(--drawer-w); height:auto; }
  .stagecol { flex:1; min-height:0; min-width:0; display:flex; flex-direction:column; gap:6px; position:relative; }
  .maparea { flex:1; min-height:0; position:relative; }
  .maparea .mapgrid { position:absolute; inset:0; display:grid; gap:6px; }
  .maparea .panel { min-width:0; min-height:0; overflow:hidden; border:1px solid var(--line); background:#fff; position:relative; }
  .maparea .panel canvas.chart { position:absolute; inset:0; width:100%; height:100%; border:none; }
  .maparea .tablepanel { overflow:auto; padding:6px; }
  #showSidebar { position:absolute; left:14px; top:14px; z-index:5; display:none; }
  #stage.nosb #showSidebar { display:block; }
  /* map view + overlays */
  .mapwrap { position:absolute; inset:0; overflow:hidden; border:1px solid var(--line); background:#fafafa; }
  .panel .mapwrap { border:none; }
  .mapwrap canvas.view { display:block; cursor:crosshair; }
  .readout { position:absolute; left:8px; top:8px; background:rgba(255,255,255,.9); border:1px solid var(--line); border-radius:4px; padding:3px 8px; font-size:11.5px; font-family:ui-monospace, Consolas, monospace; pointer-events:none; white-space:pre; }
  .readout:empty { display:none; }
  .attr { position:absolute; right:0; bottom:0; background:rgba(255,255,255,.8); font-size:10.5px; padding:1px 6px; border-top-left-radius:4px; color:#333; pointer-events:none; }
  .maptitle { position:absolute; left:50%; transform:translateX(-50%); top:8px; background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:4px; padding:2px 10px; font-size:12.5px; font-weight:600; pointer-events:none; white-space:nowrap; }
  .maplegend { position:absolute; left:8px; bottom:8px; background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:4px; padding:4px 8px; font-size:11.5px; font-family:ui-monospace, Consolas, monospace; pointer-events:none; display:flex; flex-direction:column; gap:2px; }
  .maplegend .bar { display:flex; align-items:center; gap:6px; }
  .maplegend canvas { width:180px; height:10px; border:1px solid var(--line); }
  .maplegend[hidden] { display:none; }
  .zoombtns { position:absolute; right:8px; top:8px; display:flex; flex-direction:column; gap:2px; }
  .zoombtns button { width:28px; height:26px; padding:0; font-size:14px; background:rgba(255,255,255,.95); }
  /* timebar */
  .timebar { flex:none; display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px 10px; }
  .timebar input[type=range] { flex:1; min-width:120px; }
  .timebar .t { font-family:ui-monospace, Consolas, monospace; white-space:nowrap; }
  .timebar input[type=number] { width:64px; }
  .timebar select { padding:2px 4px; }
  /* drawer */
  .drawer { flex:none; height:var(--drawer-h); min-height:0; background:var(--panel); border:1px solid var(--line); border-radius:6px; display:flex; flex-direction:column; overflow:hidden; }
  .drawer[hidden] { display:none; }
  .drawer .dhead { display:flex; align-items:center; gap:8px; padding:3px 10px; border-bottom:1px solid var(--line); cursor:ns-resize; user-select:none; font-size:12px; }
  #stage.side .drawer .dhead { cursor:ew-resize; }
  .drawer .dhead .tabs { display:flex; gap:2px; }
  .drawer .dhead .tabs button { padding:1px 9px; font-size:12px; border-radius:10px; }
  .drawer .dhead .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .drawer .dhead .info { color:var(--muted); font-family:ui-monospace, Consolas, monospace; font-size:11.5px; margin-left:auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .drawer .dbody { flex:1; min-height:0; position:relative; }
  .drawer .dbody canvas.chart { position:absolute; inset:0; width:100%; height:100%; }
  .infoline { flex:none; font-size:11.5px; color:var(--muted); font-family:ui-monospace, Consolas, monospace; white-space:pre-wrap; padding:0 4px; }
  .infoline:empty { display:none; }
  /* compare layout editor */
  .cells { display:inline-grid; gap:4px; }
  .cells select { font-size:12px; }
  .tabs.presets { display:flex; gap:4px; flex-wrap:wrap; }
  .summary { border-collapse:collapse; font-size:12px; }
  .summary th, .summary td { border:1px solid var(--line); padding:3px 8px; text-align:right; white-space:nowrap; }
  .summary th:first-child, .summary td:first-child { text-align:left; }
  .summary th { background:#f0f2f5; }
  .tables { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  #welcome { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); text-align:center; padding:24px; }
  #welcome p { max-width:52ch; }
</style>
</head>
<body>
<header class="top">
  <button id="toggleSidebar" class="icon" title="サイドバーの表示 / 非表示">≡</button>
  <h1>iRIC 計算結果ビューア</h1>
  <span id="projName" class="sub"></span>
  <span id="modeChip" class="chip" hidden></span>
  <span class="spacer"></span>
  <span id="convStatus" class="sub"></span>
  <span id="mode" class="sub"></span>
</header>
<div id="app">
  <aside id="sidebar">
    <details class="grp" id="grp-data" open>
      <summary>データ <span class="hint" id="pcount"></span></summary>
      <div class="body" id="grp-data-body">
        <div id="serverbar">
          <div id="roots"></div>
          <div id="folderbar">
            <input id="folder" type="text" placeholder="登録するフォルダ（サーバー側のパス）">
            <button id="pick" title="フォルダ選択ダイアログ">選択…</button><button id="addRoot" class="primary">登録</button>
            <button id="rescan" title="登録フォルダを再スキャン">再スキャン</button>
          </div>
        </div>
        <div class="row tight">
          <button id="pickLocalDir">フォルダを選択</button>
          <button id="pickLocalFiles">.ipro / .cgn</button>
          <button id="clearCache" title="ブラウザ内キャッシュ(IndexedDB)を削除">キャッシュ削除</button>
          <input id="localFiles" type="file" multiple accept=".ipro,.cgn,.xml" hidden>
          <input id="localDir" type="file" webkitdirectory hidden>
        </div>
        <span id="localStatus" class="sub"></span>
        <div id="findbar">
          <input id="find" type="search" placeholder="検索（名前・ソルバー・タグ）">
          <select id="sort">
            <option value="name">名前</option><option value="mtime">更新日</option><option value="nt">ステップ数</option><option value="size">サイズ</option>
            <option value="max_depth">最大水深</option><option value="peak_area">浸水面積</option><option value="last_opened">最近開いた</option>
          </select>
          <button id="sortDir" class="small" title="昇順 / 降順">↓</button>
        </div>
        <span id="status" class="sub"></span>
        <table><tbody id="plist"><tr><td class="sub">フォルダを登録するか、ローカルの .ipro / フォルダを選択してください</td></tr></tbody></table>
        <div class="row tight">
          <button id="openOne" class="primary" disabled>表示</button>
          <button id="openCompare" disabled>比較・統合解析</button>
          <button id="queueSel" disabled title="選択したプロジェクトを変換キューに入れる">変換</button>
          <button id="queueAll" title="未変換をすべて変換キューに入れる">すべて変換</button>
        </div>
        <div id="storage"></div>
        <span id="perr" class="err"></span>
      </div>
    </details>
    <details class="grp" id="grp-view" open><summary>表示</summary><div class="body" id="grp-view-body"><span class="sub">プロジェクトを開くと表示設定が出ます</span></div></details>
    <details class="grp" id="grp-analysis" open><summary>解析</summary><div class="body" id="grp-analysis-body"></div></details>
    <details class="grp" id="grp-layout" hidden><summary>レイアウト</summary><div class="body" id="grp-layout-body"></div></details>
    <details class="grp" id="grp-output"><summary>出力</summary><div class="body" id="grp-output-body"></div></details>
    <details class="grp" id="grp-settings"><summary>設定</summary><div class="body" id="grp-settings-body">
      <div class="row">キャッシュ上限 [GB] <input id="cfgLimit" type="number" min="1" step="1" style="width:70px"></div>
      <div class="row">同時変換数 <input id="cfgWorkers" type="number" min="1" max="8" step="1" style="width:60px"> <button id="cfgSave" class="small">保存</button></div>
      <span class="sub" id="cfgInfo"></span>
    </div></details>
  </aside>
  <main id="stage">
    <button id="showSidebar" class="icon" title="サイドバーを表示">≡</button>
    <div id="content" class="stagecol"><div id="welcome"><p>左の「データ」でフォルダを登録すると、その中の iRIC プロジェクトが一覧に出ます。選んで「表示」または「比較・統合解析」を押してください。未変換のものは自動で変換キューに入ります。<br>ローカルの .ipro やフォルダはサーバーなしでブラウザ内で変換できます。</p></div></div>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
