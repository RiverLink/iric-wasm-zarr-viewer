<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iRIC wasm + zarr viewer</title>
<style>
  :root { --bg:#f5f6f8; --panel:#fff; --line:#d9dce1; --fg:#1f2328; --muted:#6a707a; --accent:#1f6feb; --danger:#b42318; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, "Segoe UI", "Yu Gothic UI", sans-serif; }
  header { padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; white-space:nowrap; }
  header .sub, .sub { color:var(--muted); font-size:12px; }
  #folderbar { display:flex; gap:6px; align-items:center; flex:1; min-width:320px; }
  #folderbar[hidden] { display:none; }
  #folderbar input { flex:1; font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:4px; }
  button { font:inherit; padding:5px 10px; border:1px solid var(--line); border-radius:4px; background:#fff; cursor:pointer; color:var(--fg); }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  select, input[type=number], input[type=text] { font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:4px; background:#fff; color:var(--fg); }
  #projects { margin:10px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  #projects summary { cursor:pointer; font-weight:600; }
  #projects table { border-collapse:collapse; width:100%; font-size:13px; margin:6px 0; }
  #projects th, #projects td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); }
  #projects tr.sel { background:#eef4ff; }
  #projects .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #status { color:var(--muted); font-size:12px; }
  #content { padding:0 10px 10px; }
  .err { color:var(--danger); white-space:pre-wrap; }
  .err:empty { display:none; }
  /* map views */
  .mapwrap { position:relative; overflow:hidden; border:1px solid var(--line); background:#fafafa; }
  .mapwrap canvas { display:block; cursor:crosshair; }
  .readout { position:absolute; left:8px; top:8px; background:rgba(255,255,255,.9); border:1px solid var(--line); border-radius:4px; padding:3px 8px; font-size:12px; font-family:ui-monospace, Consolas, monospace; pointer-events:none; white-space:pre; }
  .readout:empty { display:none; }
  .attr { position:absolute; right:0; bottom:0; background:rgba(255,255,255,.8); font-size:11px; padding:1px 6px; border-top-left-radius:4px; color:#333; pointer-events:none; }
  .maptitle { position:absolute; right:8px; top:8px; background:rgba(255,255,255,.9); border:1px solid var(--line); border-radius:4px; padding:2px 8px; font-size:13px; font-weight:600; pointer-events:none; }
  /* viewer layout */
  .viewer { display:grid; grid-template-columns:230px 1fr; gap:10px; }
  .viewer aside, .stage { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; }
  .viewer aside { display:flex; flex-direction:column; gap:8px; align-self:start; }
  .viewer aside label, .ctl > label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); }
  .row { display:flex; gap:8px; align-items:center; font-size:13px; flex-wrap:wrap; }
  .row input[type=number] { width:80px; }
  .stage { display:flex; flex-direction:column; gap:8px; min-width:0; }
  .timebar { display:flex; align-items:center; gap:10px; }
  .timebar input[type=range] { flex:1; }
  .timebar .t { font-family:ui-monospace, Consolas, monospace; min-width:170px; }
  .legend { display:flex; align-items:center; gap:8px; font-size:12px; font-family:ui-monospace, Consolas, monospace; }
  .legend canvas { width:260px; height:14px; border:1px solid var(--line); }
  .stats { font-size:12px; color:var(--muted); font-family:ui-monospace, Consolas, monospace; white-space:pre-wrap; }
  details.analysis summary { cursor:pointer; font-weight:600; font-size:13px; }
  .chart { width:100%; height:260px; display:block; border:1px solid var(--line); background:#fff; }
  /* compare layout */
  .compare { display:flex; flex-direction:column; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; }
  .tabs { display:flex; gap:4px; }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .ctl { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .ctl[hidden] { display:none; }
  .mapgrid { display:grid; gap:8px; }
  .panel { min-width:0; overflow:hidden; border:1px solid var(--line); background:#fff; }
  .panel .mapwrap { border:none; }
  .panel canvas.chart { height:100%; border:none; }
  .tablepanel { overflow:auto; padding:6px; }
  .layoutbox summary { cursor:pointer; font-size:13px; font-weight:600; }
  .layoutbox .cells { display:inline-grid; gap:4px; vertical-align:middle; }
  .stage.side .body { display:grid; grid-template-columns:minmax(0,1fr) minmax(360px,42%); gap:8px; align-items:start; }
  .stage.side details.analysis { margin:0; }
  .stage.side details.analysis canvas.chart { height:auto; }
  .summary { border-collapse:collapse; font-size:12px; }
  .summary th, .summary td { border:1px solid var(--line); padding:3px 8px; text-align:right; white-space:nowrap; }
  .summary th:first-child, .summary td:first-child { text-align:left; }
  .summary th { background:#f0f2f5; }
  .bottom { display:flex; flex-direction:column; gap:8px; }
  .bottom .tables { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
</style>
</head>
<body>
<header>
  <h1>iRIC 計算結果ビューア</h1>
  <div id="folderbar">
    <span class="sub">プロジェクトフォルダ</span>
    <input id="folder" type="text" placeholder="例: C:\iRIC\projects">
    <button id="pick">フォルダ選択…</button>
    <button id="scan" class="primary">スキャン</button>
  </div>
  <span id="status"></span>
  <span id="mode" class="sub"></span>
</header>
<details id="projects" open>
  <summary>プロジェクト一覧 <span id="pcount" class="sub"></span></summary>
  <table><thead><tr><th></th><th>名前</th><th>種別</th><th>ソルバー</th><th>座標系</th><th>サイズ</th><th>変換</th><th>格子 / ステップ</th></tr></thead><tbody id="plist"><tr><td colspan="8" class="sub">フォルダをスキャンしてください</td></tr></tbody></table>
  <div class="actions" id="localbar">
    <span class="sub">ローカルファイル（ブラウザ内で変換、サーバー不要）:</span>
    <button id="pickLocalDir">フォルダを選択</button>
    <button id="pickLocalFiles">.ipro / .cgn を選択</button>
    <input id="localFiles" type="file" multiple accept=".ipro,.cgn,.xml" hidden>
    <input id="localDir" type="file" webkitdirectory hidden>
    <button id="clearCache" title="ブラウザ内キャッシュ(IndexedDB)を削除">キャッシュ削除</button>
    <span id="localStatus" class="sub"></span>
  </div>
  <div class="actions">
    <button id="openOne" class="primary" disabled>表示（1 件）</button>
    <button id="openCompare" disabled>比較・統合解析（2 件以上）</button>
    <span id="convStatus" class="sub"></span>
    <span id="perr" class="err"></span>
  </div>
</details>
<div id="content"></div>
<script type="module" src="app.js"></script>
</body>
</html>
